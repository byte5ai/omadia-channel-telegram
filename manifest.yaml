schema_version: "1"

identity:
  id: "@omadia/channel-telegram"
  name: "Telegram Channel"
  version: "0.2.2"
  kind: "channel"
  domain: "channel.telegram"
  description: "Telegram als zweiter First-Class-Channel von Omadia. Spricht die Telegram Bot API direkt (kein Drittanbieter-SDK), supports Webhook + Long-Polling-Fallback, MarkdownV2-Rendering, Inline-Keyboards für Choice-Cards / Slot-Picker / Follow-Ups, Roster via getChatAdministrators für Gruppen. Self-contained — keine `depends_on`-Beziehung. Validiert die @omadia/channel-sdk Contracts gegen ein Runtime ohne Bot-Framework."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "channel"
    - "communication"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# S+7.7 — Self-contained operator-admin UI bundled in the plugin (vanilla
# HTML+CSS+JS at dist/ui/index.html, mounted via core.registerRouter).
# When the plugin is 'active', web-dev's store-detail page embeds this
# path as an iframe so the operator never leaves the UI to manage pairings,
# DM bindings, and group activations.
# Pointing at index.html explicitly avoids the express.static directory
# redirect (301 → trailing-slash) which Next would surface to the browser
# as an absolute Location, leaking out of the /bot-api proxy prefix.
admin_ui_path: "/api/telegram/admin/ui/index.html"

# Telegram is self-contained — no parent integration. Bot token + webhook
# secret are issued by BotFather (via @BotFather chat) and stored in this
# plugin's own vault entry.
depends_on: []

setup:
  guide:
    en: |
      ## Create a Telegram bot

      Telegram bots are issued by **@BotFather** — no developer account needed.
      Takes about 2 minutes.

      ### 1. Create the bot
      1. In Telegram, open the chat with [@BotFather](https://t.me/BotFather).
      2. Send `/newbot` → pick a display name → a unique username ending in `bot`.
      3. BotFather replies with the **HTTP API token** (`123456:ABC-…`). You paste
         this as the **bot token** secret during install.
      4. Optional: `/setprivacy` → **Disable** so the bot can read all group
         messages (otherwise only commands and @mentions).

      ### 2. Public URL vs. long-polling
      - **Public HTTPS host**: set **Public HTTPS Base-URL** to your origin
        (e.g. `https://bot.example.com`). Telegram delivers updates to
        `<base>/api/telegram/webhook`.
      - **No public host** (local dev): leave it empty → the bot uses
        long-polling (getUpdates), no tunnel needed.

      ### 3. DM policy
      **DM-Auth-Policy** controls who may DM the bot: `pairing` (default — users
      pair via a QR deep-link first), `open` (anyone with the username), or
      `disabled`. Group access is handled separately when a paired operator adds
      the bot to a group.
    de: |
      ## Telegram-Bot anlegen

      Telegram-Bots vergibt **@BotFather** — kein Entwicklerkonto nötig. Dauer
      ca. 2 Minuten.

      ### 1. Bot erstellen
      1. Öffne in Telegram den Chat mit [@BotFather](https://t.me/BotFather).
      2. Sende `/newbot` → Anzeige-Name → eindeutigen Username (endet auf `bot`).
      3. BotFather antwortet mit dem **HTTP API Token** (`123456:ABC-…`). Den
         trägst du bei der Installation als **Bot-Token**-Secret ein.
      4. Optional: `/setprivacy` → **Disable**, damit der Bot in Gruppen alle
         Nachrichten liest (sonst nur Befehle und @Erwähnungen).

      ### 2. Public-URL vs. Long-Polling
      - **Öffentlicher HTTPS-Host**: **Public HTTPS Base-URL** auf deine Origin
        setzen (z.B. `https://bot.example.com`). Telegram liefert Updates an
        `<base>/api/telegram/webhook`.
      - **Kein Public-Host** (lokale Dev): leer lassen → der Bot nutzt
        Long-Polling (getUpdates), kein Tunnel nötig.

      ### 3. DM-Policy
      **DM-Auth-Policy** steuert, wer den Bot per DM anschreiben darf: `pairing`
      (Standard — Nutzer koppeln sich erst via QR-Deeplink), `open` (jeder mit
      dem Username) oder `disabled`. Gruppen-Zugriff wird separat geregelt, wenn
      ein gekoppelter Operator den Bot in eine Gruppe hinzufügt.
  fields:
    - key: "telegram_bot_token"
      type: "secret"
      label: "Telegram Bot-Token"
      help: "Der HTTP-API-Token, den @BotFather nach `/newbot` ausgibt (Format `123456:ABC-…`). Wird verschlüsselt im Plugin-Vault gespeichert (Vault-Key `telegram_bot_token`), nie in der installed.json-Config. Ohne Token kann der Channel nicht aktiviert werden."
      required: true
    - key: "telegram_public_base_url"
      type: "string"
      label: "Public HTTPS Base-URL für den Webhook"
      help: "Vollständige HTTPS-Origin auf der die Middleware öffentlich erreichbar ist (z.B. `https://bot.example.com`). Telegram registriert den Webhook unter `<base>/api/telegram/webhook` mit dem konfigurierten Secret-Token. Leer lassen → Plugin nutzt Long-Polling (getUpdates) als Fallback — gut für lokale dev ohne ngrok/cloudflared."
      required: false
    - key: "dm_policy"
      type: "string"
      label: "DM-Auth-Policy"
      help: "Wer darf den Bot per Direct-Message anschreiben? `pairing` (default ab S+7.6, safer): Nutzer müssen erst via QR-Deeplink-Flow gekoppelt werden, ungebundene DMs bekommen 'Bitte erst koppeln'-Reply. `open`: jeder mit dem Bot-Username darf chatten (Verhalten vor S+7.6). `disabled`: keine DMs zugelassen, Bot ignoriert silent. Group-Auth ist davon unabhängig (Auto-Allowlist beim Bot-Add durch gepairten Operator via `my_chat_member`-Event)."
      required: false
      default: "pairing"

playbook:
  when_to_use: |
    Der Telegram-Channel aktiviert sich, sobald ein Bot-Token vorliegt —
    bei Store-Installation über das `telegram_bot_token`-Setup-Feld (→ Vault),
    alternativ über TELEGRAM_BOT_TOKEN in der env (eingebauter Bootstrap-Pfad).
    Webhook-Secret und Admin-Token werden bei der ersten Aktivierung
    automatisch generiert und im Vault persistiert, falls nicht vorhanden.
    Zusätzlich müssen die Kernel-Capabilities chatAgent@^1, turnContext und
    memoryStore verfügbar sein. Endanwender chatten mit dem Bot 1:1 (private)
    oder in Gruppen/Supergroups; Channel-Posts werden ignoriert. Der Channel
    ownt /api/telegram/webhook (in HTTPS-Webhook-Modus) oder pollt aktiv via
    getUpdates (LP-Modus). Gruppen-Roster via getChatAdministrators
    (Bot-API-Limitierung — non-admin Members bleiben für den Orchestrator
    unsichtbar).

permissions:
  # Auto-generate + persist telegram_webhook_secret AND telegram_admin_token on
  # first activation (see plugin.ts). Gates ctx.secrets.set, scoped to this
  # plugin's own vault namespace.
  secrets:
    runtime_write: true
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound:
      - "api.telegram.org"
  filesystem:
    scratch: false

integrations:
  - id: "telegram_bot_api"
    kind: "http"
    target: "Telegram Bot API (sendMessage, getUpdates, setWebhook, getChatAdministrators)"
    auth_from: "telegram_bot_token"
    docs: "https://core.telegram.org/bots/api"

# Capabilities — Telegram is a pure CONSUMER. Channel-handle registration
# happens via DefaultChannelRegistry, not the ServiceRegistry.
#
# Hard-required (capability-resolver enforces these before activate()):
#   - `chatAgent@^1` — the orchestrator-published ChatAgentBundle. Channel
#     late-resolves it via `ctx.services.get<ChatAgentBundle>('chatAgent')`
#     and feeds `bundle.agent` into the TelegramBot. Without it the channel
#     has nothing to delegate user turns to, so we hard-block (S+10-4b).
#
# omadia#838 — declare every capability this channel resolves through
# `ctx.services.get`, retiring the `@omadia/channel-telegram` row in
# `STANDALONE_LEGACY_SERVICE_GRANTS_2026_08_20`.
#
# `requires:` (genuinely cannot activate without it, AND a plugin manifest
# declares the matching `provides:` so the capability resolver can resolve it):
#   - `chatAgent@^1`   — orchestrator-published ChatAgentBundle; activate()
#                        throws when absent.
#   - `memoryStore@^1` — the pairing store is backed by it; activate() throws
#                        when absent. Published by `@omadia/memory` /
#                        `@omadia/memory-postgres` (both declare
#                        `provides: memoryStore@1`), so a `requires:` edge
#                        resolves and orders the provider first. This replaces
#                        the earlier "structurally injected via DI, promotion
#                        deferred" note — the DI instance and this declaration
#                        name the same registry entry.
#
# `optional_requires:` (grants the same declaration the service gate asks for
# without a resolver edge — used where NO plugin manifest provides the name, so
# a `requires:` entry would be permanently unresolved and drop the channel from
# the eligible set):
#   - `turnContext@1`     — published by the middleware kernel
#                           (`middleware/src/index.ts`), not by a plugin.
#                           activate() throws when absent, but a `requires:`
#                           entry could never resolve.
#   - `channelResolver@1` — per-turn Agent routing; also kernel-side, and
#                           absence is survivable (falls back to the default
#                           chatAgent).
requires:
  - "chatAgent@^1"
  - "memoryStore@^1"
optional_requires:
  - "channelResolver@1"
  - "turnContext@1"
provides: []
